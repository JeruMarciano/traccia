[package]
name = "traccia"
version = "1.0.0"
edition = "2021"
rust-version = "1.97"
description = "Maps where an organisation's personal data goes."
publish = false

[lib]
name = "traccia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Dependency budget. Every crate here lands in the shipped binary, so each one
# has to earn its bytes. `cargo tree -i <crate>` shows whether Tauri already
# pulls it, in which case the marginal cost is close to zero.
#
#   tauri                 The shell itself.
#   tauri-plugin-dialog   Native open/save dialogs, opened from Rust so the
#                         renderer never holds a filesystem path. Wraps `rfd`,
#                         which is what any alternative would use directly. Note
#                         it also pulls tauri-plugin-fs into the graph; that is a
#                         Rust-side crate only, and capabilities/default.json
#                         grants the renderer no `fs:` permission, so the surface
#                         is not reachable from the webview. Re-check that if the
#                         capability file ever grows.
#   serde / serde_json    The project file is JSON and `invoke` is JSON. Tauri
#                         depends on both regardless — verified with
#                         `cargo tree -i serde_json`, which shows tauri v2.11.5.
#   tokio                 Async runtime for the proxy listener. Tauri depends on
#                         it regardless — verified with `cargo tree -i tokio`,
#                         which shows tauri v2.11.5. Feature set kept narrow.
#   chromiumoxide         The CDP client. Pinned to 0.7.0 by Task 0's preflight
#                         (`version = "0.7"` has exactly one match on crates.io;
#                         0.8/0.9 exist and were not taken because the plan
#                         names 0.7). Task 7's cdp.rs now reaches it from
#                         `run()`, for protocol types and a raw
#                         `chromiumoxide::conn::Connection` only — never
#                         `Browser`, never `Browser::connect` — which is the
#                         preflight's advice at §1 followed exactly. Task 12
#                         re-measured against the 2026-07-31 baseline (binary
#                         2,436,064, .dmg 1,536,327) with nothing else changed
#                         in Cargo.toml between the two builds but this crate
#                         and futures-core (net zero, see below): **+183,504
#                         bytes of binary (+7.5%) / +111,012 of .dmg (+7.2%)**.
#                         That is the whole marginal cost, attributed by
#                         subtraction against a baseline nothing else moved,
#                         and it lands well inside the preflight's own
#                         upper-bound estimate of +1,380,736 / +718,410 for a
#                         probe that also touched `Browser::launch`,
#                         `Page::execute` and `Connection::submit_command` —
#                         confirming the preflight's prediction that avoiding
#                         `Browser` would land below that figure. Method and
#                         numbers: docs/decisions/2026-08-01-v0.1-bundle-measurement.md.
#                         The preflight's own figures remain at
#                         docs/decisions/2026-08-01-v0.1-preflight.md for the
#                         record of what the upper bound looked like before
#                         Task 7 was written.
#   futures-core          The `Stream` trait, and nothing else. Task 7's cdp.rs
#                         drives `chromiumoxide::conn::Connection` directly
#                         rather than through `Browser` (preflight §1), and
#                         `Connection` is a `Stream` — polling it means naming
#                         the trait, and chromiumoxide does not re-export it.
#                         Deliberately futures-core and not `futures`: the trait
#                         alone, none of the combinators, none of the executor.
#
#                         SHIPPED BYTES: zero. This adds no package to
#                         Cargo.lock — the only change there is one line in
#                         traccia's own dependency list. futures-core 0.3.33 is
#                         already compiled into the macOS build graph, three
#                         ways over. Verified with `cargo tree -e normal -i
#                         futures-core`, which prints:
#
#                             futures-core v0.3.33
#                             ├── futures v0.3.33
#                             │   └── chromiumoxide v0.7.0
#                             │       └── traccia v1.0.0
#                             ├── futures-channel v0.3.33
#                             │   ├── futures v0.3.33 (*)
#                             │   ├── futures-util v0.3.33
#                             │   │   ├── async-tungstenite v0.27.0
#                             │   │   │   └── chromiumoxide v0.7.0 (*)
#                             ...
#
#                         i.e. it was already reachable through chromiumoxide
#                         before this line existed. Declaring it changes what
#                         this crate may name, not what the linker sees.
#
#   unicode-properties     Task 5's `tame()` — the control/format-character
#                         stripper shared by the cookie, form-field and
#                         storage-key sanitisers (Tasks 5, 8, 10) — needs the
#                         Unicode General_Category property to tell Cc
#                         (control) and Cf (format, which is where the bidi
#                         override characters U+202A-U+202E live) apart from
#                         everything else printable, which `char::is_control`
#                         alone does not cover (it is Cc only). Same shape of
#                         argument as futures-core above: already compiled in
#                         regardless, this time via lopdf's own dependency
#                         chain — `cargo tree -e normal -i unicode-properties`
#                         prints `unicode-properties v0.1.4 <- stringprep v0.1.5
#                         <- lopdf v0.44.0 <- traccia v1.0.0` before this line
#                         existed. SHIPPED BYTES: zero additional package in
#                         Cargo.lock.
#
# Deliberately NOT taken:
#   hyper / reqwest / h2  The proxy handles CONNECT only: parse a request line,
#                         answer 200 or 403, then splice bytes. An HTTP stack
#                         would add a large attack surface to the one component
#                         that must be small enough to audit by reading it.
#                         NOTE, added by Task 0: this is no longer true of the
#                         macOS build graph. hyper, hyper-util, tower,
#                         tower-http and a reqwest 0.13 were already locked via
#                         tauri, but target-gated out here — `cargo tree -e
#                         normal -i reqwest@0.13.4` prints nothing on macOS.
#                         What changed is that they are now reachable:
#                         chromiumoxide 0.7.0 depends on reqwest
#                         unconditionally (`default-features = false`, so no TLS
#                         and no h2), which pulls hyper, hyper-util, tower and
#                         tower-http. It is used in exactly one place —
#                         `Browser::connect_with_config` fetching /json/version
#                         — which is the call this project already avoids by
#                         reading DevToolsActivePort. Reachable only through
#                         `Browser::connect`; the ~200 KB above is what that
#                         reachability costs. Phase 2 decides whether to pay it.
#   chromiumoxide's own   `Target.attachedToTarget` → immediate
#   attach handling       `Runtime.runIfWaitingForDebugger`, hardcoded in the
#                         crate's `pub(crate)` handler, with no hook to arm
#                         Fetch first. This is the F2 race the CDP spike proved
#                         must not happen, so the interception loop cannot be
#                         delegated to `Browser`. See the preflight doc §1.
#   tokio-util            The obvious home for a CancellationToken, and the type
#                         Task 7's brief named. Not taken: unlike futures-core
#                         it is genuinely absent from this build graph — `cargo
#                         tree -e normal -i tokio-util` prints "nothing to
#                         print" on macOS — so taking it would compile and ship
#                         a new crate. cdp.rs defines its own
#                         `CancellationToken` over an Arc<AtomicBool> instead:
#                         set a flag, read a flag, which is the whole of what a
#                         scan needs to be stoppable. If a later task wants the
#                         real token's `cancelled()` future to await on, that is
#                         a dependency decision to take then, with bytes
#                         measured — not a thing to inherit by accident.
#   uuid                  Temp-file uniqueness comes from pid + a process-local
#                         counter + nanos since epoch. Same guarantee, no crate.
#   tokio-tungstenite     CDP is Phase 2. Not added until it is needed.
#                         NOTE, added by Task 0: still not taken, but a
#                         WebSocket stack is compiled in regardless, because
#                         chromiumoxide 0.7.0 brings its own — async-tungstenite
#                         0.27.0, and under it tungstenite 0.23.0, which adds
#                         rand 0.8.7, rand_chacha, ppv-lite86, zerocopy, sha1
#                         and data-encoding. chromiumoxide also pulls which
#                         6.0.3 (browser discovery), which adds a second rustix
#                         0.38 alongside the one already locked. So the choice
#                         Phase 2 faces is not "add a WebSocket crate or not" —
#                         it is which of the two already-compiled stacks owns
#                         the CDP transport. Preflight doc §1 argues for a raw
#                         connection either way; if that ends up being
#                         tokio-tungstenite, drop chromiumoxide's transport
#                         rather than shipping both.
#   tauri-plugin-opener   Shipped by create-tauri-app and removed here. It hands
#                         a URL or a path to the OS to open, which is precisely
#                         the egress and execution surface this app must not have.
#   Playwright and a      The obvious alternative to hand-rolled CDP: a
#   bundled Node runtime  browser-automation library and the JS runtime it
#                         needs to run in. Not taken. Playwright alone bundles
#                         its own browser binaries and a Node runtime is
#                         roughly 60 MB against this project's ~1.5 MB
#                         baseline .dmg (docs/decisions/2026-07-31-tauri-bundle-measurement.md) —
#                         a two-order-of-magnitude jump for a dependency this
#                         app needs for one narrow job: attach CDP, watch
#                         requests, detach. `chromiumoxide`'s typed protocol
#                         plus a raw connection does that job at +183,504
#                         bytes, and the author chose the smaller download.
#
#   v0.2 Task 1 — src-tauri/src/extract.rs, local text extraction from documents a client
#   hands over. Four crates, chosen as the lightest of the candidates named by the plan.
#   None adds a new copyleft license: `cargo tree --format "{p}|{l}"` after adding all four
#   shows only the same five MPL-2.0 crates already recorded in THIRD-PARTY-LICENSES.md, and
#   otherwise MIT/Apache-2.0/BSD/Zlib/Unicode-3.0/0BSD/BSL-1.0/CC0/Unlicense throughout.
#   Measured against the release binary before this task (2,652,608 bytes) and after
#   (3,844,608 bytes): **+1,192,000 bytes (+45%)**, almost all of it lopdf's own transitive
#   crypto stack (see below) — this is the cost of shipping real PDF/DOCX/XLSX parsing, not
#   something a lighter crate choice would have avoided.
#
#   quick-xml             DOCX's `word/document.xml` is read as a stream of `w:t`/`w:p`
#                         events. Already transitive (tauri → plist → quick-xml 0.41.0 on
#                         macOS, `cargo tree -i quick-xml`), so this line only lets extract.rs
#                         name it — SHIPPED BYTES: zero additional package in Cargo.lock,
#                         same reasoning as futures-core above.
#   zip                   Reads the DOCX archive as streamed entries — `by_name`, never
#                         `.extract()` — so nothing is ever written to disk. Pinned to the
#                         latest (8.6.0) with `default-features = false, features =
#                         ["deflate"]`: the smallest read-capable feature set (no encryption,
#                         no bzip2/lzma/zstd, no write-side zopfli... except zip's own
#                         "deflate" feature pulls zopfli transitively regardless, since the
#                         crate does not split read/write compression backends further at
#                         this feature granularity — confirmed with `cargo tree -p zip`).
#                         New packages: zip, typed-path, zlib-rs, zopfli.
#   calamine               XLSX cell reading, `default-features = false` (drops chrono/dates/
#                         picture — this app only needs `Data::to_string()` per cell, not
#                         typed dates or embedded images). New packages: calamine, atoi_simd,
#                         codepage, debug_unsafe, encoding_rs, fast-float2.
#   lopdf                  PDF text extraction, `default-features = false` (drops chrono/jiff/
#                         rayon/serde/image/font_embedding/async/tokio/wasm_js — none of which
#                         extract.rs's text-only path needs). Brings its own bomb-safe API
#                         (`extract_text_chunks_with_limit`, used directly instead of
#                         hand-rolling the same guard) at the cost of a crypto stack the PDF
#                         spec's encryption support pulls in unconditionally — encrypted PDFs
#                         are common enough in the wild that a crate without that support was
#                         not a real alternative. New packages: lopdf, nom, rand, rand_core,
#                         sha2, md-5, aes, cbc, ecb, cipher, digest (both 0.10 and 0.11 —
#                         calamine and lopdf pin different majors), block-buffer (both),
#                         crypto-common (both), block-padding, const-oid, cpubits,
#                         cpufeatures, hybrid-array, inout, rangemap, stringprep,
#                         unicode-bidi, unicode-normalization, unicode-properties, weezl.
#
# Deliberately NOT taken (v0.2 Task 1):
#   A custom decompression  `zip`'s `deflate` feature already routes through `flate2`, which
#   backend for zip          this build graph carries regardless (`png` → `muda` → `tauri`),
#                             so there was no smaller-footprint alternative to reach for.
#
# v0.2 security audit, Finding 2 (IMPORTANT), superseding a claim this comment used to make:
# XLSX's zip-bomb guard used to sum the archive's *declared* uncompressed sizes (cheap, no
# decompression) and refuse before calling into `calamine` if that total exceeded
# `MAX_DECOMPRESSED_BYTES`. That trusted a number the `zip` crate does not itself enforce during
# inflation — a forged small declared size wrapping a highly compressible stream sailed through.
# The fix (extract.rs's `true_uncompressed_total_exceeds_cap`) decompresses every entry itself,
# streaming, through this crate's own `zip` dependency and the same `read_capped` ceiling DOCX
# already used, and sums the bytes actually produced. `calamine` still does its own separate zip
# decompression afterwards to read cells — this module cannot hook into that to bound it — so an
# honest XLSX is now decompressed twice. Accepted cost for a bound that is actually true.

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"] }
futures-core = "0.3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
calamine = { version = "0.36.1", default-features = false }
lopdf = { version = "0.44.0", default-features = false }
quick-xml = "0.41.0"
unicode-properties = "0.1.4"

[dev-dependencies]
# Dev only. Never shipped.
tempfile = "3"
# Self dependency, `test-support` feature only: `tests/egress.rs` links this crate as an
# external integration test and needs `scan::run_scan_for_test*`, `scan::LaunchHook`,
# `scan::ScanRun` and `proxy::Ledger::poison_for_test` — real `pub` seams, but ones a
# release build must not carry (see [features] below). Without this line those seams
# would either have to be `pub` unconditionally (shipping in every build, including the
# release rlib) or invisible to `tests/egress.rs` (which cannot see a `#[cfg(test)]` item
# in the crate it links against). This is the standard pattern for exposing test-only `pub`
# surface to an integration test without shipping it.
traccia = { path = ".", features = ["test-support"] }

[features]
# Off by default, so `cargo build --release` (and every other default build) never carries
# the seams below. On for `tests/egress.rs` via the self dev-dependency above, and can be
# turned on explicitly for any other integration test that needs the same seams.
test-support = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# v0.2 security audit, Finding 1 (CRITICAL): this used to abort on panic instead of unwinding.
# With no unwinding at all in the shipped binary, two things were false at once. First,
# `extract.rs`'s `catch_unwind` around a hostile document's parse (lopdf/calamine/zip/
# quick-xml — none of it `unsafe`, but none of it proof against a panic either) was inert:
# the panic would abort the whole process instead of being caught, and only the *test*
# profile's unwind made the test at extract.rs's `catch_unwind` call site pass — false
# assurance, since the release build behaved differently from the test that was supposed to
# prove it safe. Second, and independently, it meant `Drop` never ran on a panic, which is
# `browser::Launched`'s teardown: a panicked scan orphaned headless Chrome and left the
# scanned site's cookies sitting in a 0700 temp profile dir that nothing then removed (see
# browser.rs's `Drop for Launched`, and the Task 6/8 notes this closes). `panic = "unwind"`
# fixes both: `catch_unwind` actually catches, and `Drop::drop` actually runs. It does NOT
# make cleanup unconditional — `std::process::exit` and a hard `abort()` (e.g. from a double
# panic, or from Rust's own guard against unwinding across an FFI boundary) still run no
# destructors; see browser.rs's `Drop for Launched` doc comment for what remains true there.
# tests/cargo_toml_profile.rs pins this so the setting cannot silently regress back to abort.
panic = "unwind"
strip = true
