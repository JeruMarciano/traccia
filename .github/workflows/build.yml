# Windows cannot be built from the development Mac: the target installs, but no MSVC linker is
# present, and Tauri's MSI bundler is Windows-only. cargo-xwin would work by fetching Microsoft
# CRT and SDK headers, whose redistribution terms do not fit this project's licence constraints,
# so the answer is a Windows runner rather than a local cross-build.
#
# Nothing here publishes. Releases are made by hand from the artefacts this workflow produces,
# because §8.1 makes updates manual and §7 forbids the app contacting a server.
name: build

on:
  # A push to a feature branch not named here (e.g. this one, v0.1-external-map) does not
  # trigger this workflow directly — it relies on the paired `pull_request` trigger below,
  # which runs on every PR regardless of source branch name. Direct-push coverage is
  # intentionally narrow; PR coverage is what every branch actually gets.
  push:
    branches: [main, tauri-port]
    # A tag is a release, and a release runs everything, macOS included.
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: 'Also run the macOS jobs (bills at ×10 — the .dmg can be built locally on a Mac for free)'
        type: boolean
        default: false

permissions:
  contents: read

# The repository is public, so Actions minutes are free and the test matrix is not rationed:
# every push and pull request runs the Rust suite on both macOS and Windows.
#
# Bundling stays release-only, and that is not a cost decision. Building installers on every push
# spends ten minutes producing a .dmg and an .msi that nobody downloads until a release is cut.
# It runs on a tag, or on a manual run, which is when the artefacts are actually wanted. Ticking
# the `macos` input adds the macOS installer to a manual run; a Mac can also build its own with
# `npm run tauri build`.

jobs:
  check:
    name: tests and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:vite
      - run: npm test

  rust:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo test
        working-directory: src-tauri
        # `--test-threads=1`: `tests/egress.rs` launches a real, ephemeral Chrome/Edge per test,
        # several of them concurrently under the default scheduler contends for the launcher's
        # DevToolsActivePort wait and was observed to fail one test in five spuriously with
        # SCAN_FAILED under -j (the runtime worker pool sharing CPU with a launch that blocks for
        # up to ten seconds). Serial execution was reliable across repeated local runs; the whole
        # Rust suite still finishes in well under a minute.
        #
        # No browser is installed by this workflow: macos-latest and windows-latest ship Google
        # Chrome and Microsoft Edge pre-installed (github/actions/runner-images). If that ever
        # stops being true, `browser::discover` returns `SCAN_NO_BROWSER`, every scan-dependent
        # test in `tests/egress.rs` panics on `.expect("scan should complete")` rather than being
        # skipped, and this step fails outright — a hard failure, not a silent absence, which is
        # the property this line exists to keep. (`ubuntu-latest` is not in this matrix at all;
        # ubuntu-latest is not built here, per the header comment above.)
        run: cargo test --locked -- --test-threads=1
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo install cargo-audit --locked
      # A real gate: `cargo audit` exits non-zero (failing this job) on any advisory of type
      # "vulnerability" found in Cargo.lock, whether direct or transitive — the whole reason
      # this step exists. It exits zero on advisories of type "unmaintained"/"unsound" ("notice"
      # in RustSec's own taxonomy), which today includes ~17 gtk-rs GTK3-binding advisories
      # (RUSTSEC-2024-0411 through -0420 and others) reached transitively through Tauri's Linux
      # windowing stack (tao/rfd/muda) — present in Cargo.lock because Cargo resolves one
      # dependency graph across every platform, even though this workflow's own `rust`/`bundle`
      # jobs only ever build macOS and Windows (see this file's header comment). Those are
      # unfixable from this project's side (no Linux build to drop the GTK3 feature from, and no
      # newer gtk-rs release exists to move to) and are not CVEs, so they are left as the
      # warnings `cargo audit` already treats them as rather than escalated with `--deny warnings`
      # and then blanket-ignored — that would silence this gate for a real future vulnerability
      # in the same crates. As of this job's addition, `cargo audit` finds zero vulnerabilities
      # in this tree: nothing is pinned with `--ignore` below. If a genuinely unfixable
      # *vulnerability* (not a mere "unmaintained" notice) ever appears, pin its RUSTSEC id here
      # with `--ignore RUSTSEC-XXXX-XXXX` and a comment naming it and why it cannot be fixed —
      # never widen this to a blanket ignore, or the gate stops meaning anything for every other
      # advisory.
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

  bundle:
    name: bundle (${{ matrix.os }})
    needs: [check, rust]
    # Bundling is a release activity: it produces the installers a release is made by hand from,
    # and it is the single most expensive thing here (a macOS bundle alone bills ~100 minutes).
    # Nothing between releases consumes its output, so it waits for a tag or a manual run.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        # Windows is the reason this job exists at all: it cannot be built from the development
        # Mac (no MSVC linker, and the MSI bundler is Windows-only — see this file's header). The
        # .dmg can be built locally with `npm run tauri build` at no cost, so macOS is opt-in.
        os: >-
          ${{ (startsWith(github.ref, 'refs/tags/') || inputs.macos)
          && fromJSON('["macos-latest", "windows-latest"]')
          || fromJSON('["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          # Both macOS architectures, because the .dmg is built as a universal binary. A runner
          # only ever has its own target installed by default, and macos-latest is Apple Silicon:
          # without this the release ships a download that does not start on an Intel Mac.
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: build the installer
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            npm run tauri build -- --target universal-apple-darwin
          else
            npm run tauri build
          fi
      # A portable copy alongside the installer. On Windows this is the compiled binary itself,
      # which needs no installation and no administrator rights: a consultant standing at a
      # client's machine often has neither. On macOS the .app is already a self-contained folder,
      # so it only needs zipping, and `ditto` is used rather than `zip` because it preserves the
      # bundle's structure and executable bits where a plain archive does not.
      - name: package the portable copy
        shell: bash
        run: |
          # The version comes from the manifest, not from the ref: a manual run's ref_name is a
          # branch, and "Traccia_main_portable.exe" tells a downloader nothing.
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p portable
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              src-tauri/target/universal-apple-darwin/release/bundle/macos/Traccia.app \
              "portable/Traccia_${VERSION}_universal_portable.app.zip"
          else
            cp src-tauri/target/release/traccia.exe \
              "portable/Traccia_${VERSION}_x64_portable.exe"
          fi
          ls -l portable

      - name: report the shipped size
        shell: bash
        run: |
          # The download size is a product requirement, not a curiosity. Print it on every run so
          # a regression is visible in the log without anyone going looking.
          find src-tauri/target -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) \
            -exec ls -l {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: traccia-${{ matrix.os }}
          # The universal build lands under its own target directory, so both roots are listed.
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            portable/*
          if-no-files-found: warn
