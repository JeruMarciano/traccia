# Windows cannot be built from the development Mac: the target installs, but no MSVC linker is
# present, and Tauri's MSI bundler is Windows-only. cargo-xwin would work by fetching Microsoft
# CRT and SDK headers, whose redistribution terms do not fit this project's licence constraints,
# so the answer is a Windows runner rather than a local cross-build.
#
# Nothing here publishes. Releases are made by hand from the artefacts this workflow produces,
# because §8.1 makes updates manual and §7 forbids the app contacting a server.
name: build

on:
  push:
    branches: [main, tauri-port]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: tests and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:vite
      - run: npm test

  rust:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

  bundle:
    name: bundle (${{ matrix.os }})
    needs: [check, rust]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri build
      - name: report the shipped size
        shell: bash
        run: |
          # The download size is a product requirement, not a curiosity. Print it on every run so
          # a regression is visible in the log without anyone going looking.
          find src-tauri/target/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) \
            -exec ls -l {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: traccia-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
